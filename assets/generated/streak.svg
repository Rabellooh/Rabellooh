<svg xmlns="http://www.w3.org/2000/svg" width="820" height="190" viewBox="0 0 820 190" role="img" aria-labelledby="title desc">
<title id="title">GitHub Streak</title>
<desc id="desc">Current streak 1 day. Best streak 3 days.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#0D1117"/>
    <stop offset="1" stop-color="#111820"/>
  </linearGradient>
  <linearGradient id="g" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#39D98A"/>
    <stop offset="1" stop-color="#00A86B"/>
  </linearGradient>
</defs>
<rect x="1" y="1" width="818" height="188" rx="16" fill="url(#bg)" stroke="#30363D"/>
<text x="34" y="43" fill="#39D98A" font-family="Consolas,Monaco,monospace" font-size="20" font-weight="700">GitHub Streak</text>
<text x="34" y="69" fill="#8B949E" font-family="Segoe UI,Arial,sans-serif" font-size="13">Consistência de contribuições</text>

<line x1="273" y1="87" x2="273" y2="151" stroke="#30363D"/>
<line x1="547" y1="87" x2="547" y2="151" stroke="#30363D"/>

<text x="137" y="111" text-anchor="middle" fill="#F0F6FC" font-family="Segoe UI,Arial,sans-serif" font-size="31" font-weight="700">1</text>
<text x="137" y="135" text-anchor="middle" fill="#8B949E" font-family="Segoe UI,Arial,sans-serif" font-size="13">sequência atual</text>

<text x="410" y="111" text-anchor="middle" fill="#F0F6FC" font-family="Segoe UI,Arial,sans-serif" font-size="31" font-weight="700">3</text>
<text x="410" y="135" text-anchor="middle" fill="#8B949E" font-family="Segoe UI,Arial,sans-serif" font-size="13">melhor sequência</text>

<text x="684" y="111" text-anchor="middle" fill="#39D98A" font-family="Segoe UI,Arial,sans-serif" font-size="25" font-weight="700">ACTIVE</text>
<text x="684" y="135" text-anchor="middle" fill="#8B949E" font-family="Segoe UI,Arial,sans-serif" font-size="13">última atividade</text>

<rect x="34" y="159" width="752" height="4" rx="2" fill="#21262D"/>
<rect x="34" y="159" width="248" height="4" rx="2" fill="url(#g)"/>
</svg>