<svg xmlns="http://www.w3.org/2000/svg" width="900" height="58" viewBox="0 0 900 58" role="img" aria-labelledby="title desc">
<title id="title">Áreas de atuação de Gabriel Rabello</title>
<desc id="desc">Animação alternando entre suporte, infraestrutura, automação e desenvolvimento interno.</desc>
<style>
  .line { opacity: 0; animation: cycle 16s linear infinite; }
  .l1 { animation-delay: 0s; }
  .l2 { animation-delay: 4s; }
  .l3 { animation-delay: 8s; }
  .l4 { animation-delay: 12s; }
  @keyframes cycle {
    0% { opacity: 0; }
    3% { opacity: 1; }
    22% { opacity: 1; }
    25% { opacity: 0; }
    100% { opacity: 0; }
  }
  .cursor { animation: blink .9s steps(1,end) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
</style>
<rect width="900" height="58" rx="12" fill="#0D1117"/>
<text x="24" y="37" fill="#39D98A" font-family="Consolas,Monaco,monospace" font-size="20">$</text>
<g font-family="Consolas,Monaco,monospace" font-size="19" fill="#E6EDF3">
  <text class="line l1" x="50" y="37">Suporte N1/N2 &amp; Infraestrutura de TI</text>
  <text class="line l2" x="50" y="37">Automação aplicada à rotina de suporte</text>
  <text class="line l3" x="50" y="37">Python • Flask • PostgreSQL • Docker</text>
  <text class="line l4" x="50" y="37">Transformando problemas operacionais em soluções.</text>
</g>
<rect class="cursor" x="842" y="17" width="8" height="24" rx="1" fill="#39D98A"/>
</svg>