<svg xmlns="http://www.w3.org/2000/svg" width="900" height="58" viewBox="0 0 900 58" role="img" aria-labelledby="title desc">
<title id="title">Áreas de atuação de Gabriel Rabello</title>
<desc id="desc">Texto animado alternando entre suporte, infraestrutura, automação e desenvolvimento interno.</desc>
<rect width="900" height="58" rx="12" fill="#0D1117"/>
<text x="24" y="37" fill="#39D98A" font-family="Consolas,Monaco,monospace" font-size="20">$</text>
<g font-family="Consolas,Monaco,monospace" font-size="19" fill="#E6EDF3">
  <text x="50" y="37" opacity="0">Suporte N1/N2 &amp; Infraestrutura de TI
    <animate attributeName="opacity" values="1;1;0;0;0" keyTimes="0;0.22;0.25;0.97;1" dur="16s" repeatCount="indefinite"/>
  </text>
  <text x="50" y="37" opacity="0">Automação aplicada à rotina de suporte
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.24;0.25;0.47;0.50;1" dur="16s" repeatCount="indefinite"/>
  </text>
  <text x="50" y="37" opacity="0">Python • Flask • PostgreSQL • Docker
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.49;0.50;0.72;0.75;1" dur="16s" repeatCount="indefinite"/>
  </text>
  <text x="50" y="37" opacity="0">Transformando problemas operacionais em soluções.
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.74;0.75;0.97;1" dur="16s" repeatCount="indefinite"/>
  </text>
</g>
<rect x="842" y="17" width="8" height="24" fill="#39D98A">
  <animate attributeName="opacity" values="1;0;1" dur="0.9s" repeatCount="indefinite"/>
</rect>
</svg>