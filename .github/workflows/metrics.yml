name: GitHub Profile Metrics

on:
  workflow_dispatch:
  schedule:
    - cron: "20 6 * * *"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/metrics.yml"

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: General GitHub stats
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          committer_token: ${{ secrets.GITHUB_TOKEN }}
          user: Rabellooh
          filename: assets/generated/stats.svg
          base: header, activity, community, repositories, metadata
          config_timezone: America/Sao_Paulo
          config_display: regular
          output_action: commit

      - name: Top languages
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          committer_token: ${{ secrets.GITHUB_TOKEN }}
          user: Rabellooh
          filename: assets/generated/languages.svg
          base: ""
          plugin_languages: yes
          plugin_languages_details: percentage
          plugin_languages_limit: 8
          config_timezone: America/Sao_Paulo
          output_action: commit


      - name: Activity graph
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          committer_token: ${{ secrets.GITHUB_TOKEN }}
          user: Rabellooh
          filename: assets/generated/activity.svg
          base: ""
          plugin_habits: yes
          plugin_habits_from: 400
          plugin_habits_days: 30
          plugin_habits_facts: no
          plugin_habits_charts: yes
          plugin_habits_charts_type: graph
          config_timezone: America/Sao_Paulo
          output_action: commit

      - name: GitHub achievements
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          committer_token: ${{ secrets.GITHUB_TOKEN }}
          user: Rabellooh
          filename: assets/generated/trophies.svg
          base: ""
          plugin_achievements: yes
          plugin_achievements_display: compact
          plugin_achievements_threshold: C
          config_timezone: America/Sao_Paulo
          output_action: commit
