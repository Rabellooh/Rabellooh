name: Contribution Snake

on:
  workflow_dispatch:
  schedule:
    - cron: "40 6 * * *"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Generate snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=%2339D98A&color_dots=%23ebedf0,%23b7f7d5,%237be8b3,%2339D98A,%2300A86B
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=%2339D98A

      - name: Publish snake to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
